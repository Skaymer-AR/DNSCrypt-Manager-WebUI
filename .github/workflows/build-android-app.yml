name: Build DNSCrypt Manager Android app

on:
  push:
    branches:
      - codex/native-android-app-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-module-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install module build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            zip unzip binutils file iproute2 nodejs python3 ca-certificates

      - name: Run module gate and package candidate
        env:
          DCM_OUTPUT: ${{ runner.temp }}/DNSCrypt-Manager-v1.1.1-rc2.zip
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-module.sh | tee "$RUNNER_TEMP/build-module.log"
          test -s "$DCM_OUTPUT"
          unzip -tq "$DCM_OUTPUT"
          unzip -p "$DCM_OUTPUT" module.prop | tr -d '\r' > "$RUNNER_TEMP/module.prop"
          grep -qx 'version=v1.1.1-rc2' "$RUNNER_TEMP/module.prop"
          grep -qx 'versionCode=11012' "$RUNNER_TEMP/module.prop"
          module_zip="$(basename "$DCM_OUTPUT")"
          (cd "$(dirname "$DCM_OUTPUT")" && sha256sum "$module_zip" > "$module_zip.sha256")

      - name: Upload module candidate
        uses: actions/upload-artifact@v4
        with:
          name: DNSCrypt-Manager-v1.1.1-rc2-candidate
          path: |
            ${{ runner.temp }}/DNSCrypt-Manager-v1.1.1-rc2.zip
            ${{ runner.temp }}/DNSCrypt-Manager-v1.1.1-rc2.zip.sha256
            ${{ runner.temp }}/build-module.log
          if-no-files-found: error
          retention-days: 14

  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and hash APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          file "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DNSCrypt-Manager-Android-debug
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
