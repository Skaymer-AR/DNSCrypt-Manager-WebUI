name: Build DNSCrypt Manager Android app

on:
  push:
    branches:
      - main
      - codex/android-manager-next-features
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-module-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install module build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            zip unzip binutils file iproute2 nodejs python3 ca-certificates

      - name: Run module gate and package stable release
        env:
          DCM_OUTPUT: ${{ runner.temp }}/DNSCrypt-Manager-v1.2.0.zip
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-module.sh | tee "$RUNNER_TEMP/build-module.log"
          test -s "$DCM_OUTPUT"
          unzip -tq "$DCM_OUTPUT"
          unzip -p "$DCM_OUTPUT" module.prop | tr -d '\r' > "$RUNNER_TEMP/module.prop"
          grep -qx 'version=v1.2.0' "$RUNNER_TEMP/module.prop"
          grep -qx 'versionCode=12003' "$RUNNER_TEMP/module.prop"
          module_zip="$(basename "$DCM_OUTPUT")"
          (cd "$(dirname "$DCM_OUTPUT")" && sha256sum "$module_zip" > "$module_zip.sha256")

      - name: Upload module release package
        uses: actions/upload-artifact@v4
        with:
          name: DNSCrypt-Manager-v1.2.0-release
          path: |
            ${{ runner.temp }}/DNSCrypt-Manager-v1.2.0.zip
            ${{ runner.temp }}/DNSCrypt-Manager-v1.2.0.zip.sha256
            ${{ runner.temp }}/build-module.log
          if-no-files-found: error
          retention-days: 14

  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Validate Android Spanish and English resources
        run: python3 tests/smoke-test-android-i18n.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Compare APK signing certificate with the last published APK
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          candidate="android-app/app/build/outputs/apk/debug/app-debug.apk"
          previous="$RUNNER_TEMP/previous-DNSCrypt-Manager-Android-v0.4.1-debug.apk"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$previous" \
            "https://github.com/Skaymer-AR/DNSCrypt-Manager-WebUI/releases/download/v1.2.0-rc2/DNSCrypt-Manager-Android-v0.4.1-debug.apk"
          candidate_cert="$("$apksigner" verify --print-certs "$candidate" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr 'A-F' 'a-f')"
          previous_cert="$("$apksigner" verify --print-certs "$previous" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr 'A-F' 'a-f')"
          test -n "$candidate_cert"
          test -n "$previous_cert"
          {
            echo "### Android APK signing compatibility"
            echo
            echo "- Previous release APK: \`v1.2.0-rc2\`"
            echo "- Stable candidate SHA-256 certificate: \`$candidate_cert\`"
            echo "- Previous SHA-256 certificate: \`$previous_cert\`"
            if [ "$candidate_cert" = "$previous_cert" ]; then
              echo "- Can install over the previous APK without removing it: **yes**"
            else
              echo "- Can install over the previous APK without removing it: **no**; uninstall the old app first. The DNSCrypt module and its settings are separate."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$candidate_cert" = "$previous_cert" ]; then
            echo "The stable APK can update the last published APK in place."
          else
            echo "::warning::The stable APK uses a different signing certificate. Install it after uninstalling the old app."
          fi

      - name: Verify and hash APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          file "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DNSCrypt-Manager-Android-debug
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  publish-big-update:
    needs:
      - build-module-release
      - build-debug-apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Skaymer-AR/DNSCrypt-Manager-WebUI'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7

      - name: Download verified module ZIP
        uses: actions/download-artifact@v4
        with:
          name: DNSCrypt-Manager-v1.2.0-release
          path: ${{ runner.temp }}/module

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: DNSCrypt-Manager-Android-debug
          path: ${{ runner.temp }}/android

      - name: Verify and prepare release assets
        shell: bash
        env:
          ASSETS: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          mkdir -p "$ASSETS"
          cp "$RUNNER_TEMP/module/DNSCrypt-Manager-v1.2.0.zip" "$ASSETS/"
          cp "$RUNNER_TEMP/module/DNSCrypt-Manager-v1.2.0.zip.sha256" "$ASSETS/"
          cp "$RUNNER_TEMP/android/app-debug.apk" "$ASSETS/DNSCrypt-Manager-Android-v0.4.2-debug.apk"
          cp release/v1.2.0/RELEASE_NOTES_ES.md "$ASSETS/"
          cp release/v1.2.0/RELEASE_NOTES_EN.md "$ASSETS/"

          unzip -tq "$ASSETS/DNSCrypt-Manager-v1.2.0.zip"
          unzip -p "$ASSETS/DNSCrypt-Manager-v1.2.0.zip" module.prop | tr -d '\r' > "$RUNNER_TEMP/release-module.prop"
          grep -qx 'version=v1.2.0' "$RUNNER_TEMP/release-module.prop"
          grep -qx 'versionCode=12003' "$RUNNER_TEMP/release-module.prop"
          grep -Eq '^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*10[[:space:]]*$' android-app/app/build.gradle.kts
          grep -Eq '^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"0[.]4[.]2"[[:space:]]*$' android-app/app/build.gradle.kts
          test -s "$ASSETS/DNSCrypt-Manager-Android-v0.4.2-debug.apk"
          (cd "$ASSETS" && sha256sum DNSCrypt-Manager-Android-v0.4.2-debug.apk > DNSCrypt-Manager-Android-v0.4.2-debug.apk.sha256)
          (cd "$ASSETS" && sha256sum -c DNSCrypt-Manager-v1.2.0.zip.sha256)
          (cd "$ASSETS" && sha256sum -c DNSCrypt-Manager-Android-v0.4.2-debug.apk.sha256)
          test -s release/v1.2.0/RELEASE_NOTES.md
          test -s "$ASSETS/RELEASE_NOTES_ES.md"
          test -s "$ASSETS/RELEASE_NOTES_EN.md"

      - name: Publish GitHub stable release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ runner.temp }}/release-assets
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.2.0'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release $TAG ya existe; se actualizan las notas sin cambiar sus binarios."
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'DNSCrypt Manager Big Update 1.2.0 — Android 0.4.2' \
              --notes-file release/v1.2.0/RELEASE_NOTES.md
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "El tag $TAG ya existe sin una Release; se omite para evitar moverlo."
            exit 0
          fi
          gh release create "$TAG" "$ASSETS"/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'DNSCrypt Manager Big Update 1.2.0 — Android 0.4.2' \
            --notes-file release/v1.2.0/RELEASE_NOTES.md
